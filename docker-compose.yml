version: '3.8'

services:
  # PostgreSQL with pgvector extension pre-installed
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartdocs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smartdocs_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartdocs_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Express Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartdocs_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/smartdocs_ai
      - JWT_SECRET=production-secret-must-be-at-least-32-characters-long
      - JWT_EXPIRES_IN=7d
      - UPLOAD_DIR=/app/uploads
      - UPLOAD_MAX_SIZE_MB=10
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_EMBEDDING_MODEL=text-embedding-004
      - AI_EMBEDDING_DIMENSION=768
      - AI_GENERATION_MODEL=gemini-1.5-flash
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # React Vite Frontend SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartdocs_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
